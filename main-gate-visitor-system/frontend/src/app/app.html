<div class="app-wrapper">
  <!-- Top Navigation Header -->
  <header class="navbar">
    <div class="nav-brand">
      <div class="brand-badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
      </div>
      <div>
        <h1 class="brand-title">GATEKEEPER</h1>
        <div class="brand-tagline">Main Gate Visitor Entry Authorization System</div>
      </div>
    </div>

    <nav class="nav-links">
      <a routerLink="/authorize" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
        Visitor Authorization
      </a>
      <a routerLink="/gate" routerLinkActive="active" class="nav-item">
        Main Gate Security
      </a>
      <a routerLink="/admin" routerLinkActive="active" class="nav-item">
        Admin & Logs
      </a>
    </nav>
  </header>

  <!-- Main View Area -->
  <main class="content-container">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div>Gatekeeper Enterprise Security Architecture &bull; Angular + Node.js + SQLite &bull; Excel Synchronized</div>
  </footer>
</div>
