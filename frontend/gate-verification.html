<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main Gate Verification</title>
  <meta name="description" content="Main Gate Security Counter Verification Portal">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation -->
  <header class="top-header">
    <div class="nav-container">
      <a href="index.html" class="brand-badge">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div class="brand-info">
          <h1>Main Gate Security</h1>
          <div class="sub">Security Personnel Console</div>
        </div>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link" id="nav-visitor-auth">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="23" y1="11" x2="17" y2="11"></line>
          </svg>
          Authorize Entry
        </a>
        <a href="gate-verification.html" class="nav-link active" id="nav-gate-verify">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
          Gate Verification
        </a>
        <a href="admin.html" class="nav-link" id="nav-admin-pin">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          Admin PIN
        </a>
      </nav>
    </div>
  </header>

  <!-- Main Body Content -->
  <main class="main-content">
    <div class="portal-container">
      <div class="portal-card">
        
        <div class="card-header">
          <div class="header-tag" style="background: rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.3); color: #93c5fd;">
            Gate Terminal
          </div>
          <h2>MAIN GATE VERIFICATION</h2>
          <p>Verify visitor arrival and authorization PIN to allow entry.</p>
        </div>

        <form id="verification-form" autocomplete="off">
          
          <!-- Visitor Names Section ONLY -->
          <div class="form-section">
            <div class="section-label-row">
              <label class="form-label">
                Visitor Names
                <span class="required-indicator">*</span>
              </label>
            </div>
            
            <div id="verify-visitor-list-container" class="visitor-list">
              <div class="visitor-row">
                <div class="input-icon-wrapper">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                  <input 
                    type="text" 
                    id="verify-visitor-name-1" 
                    class="form-control visitor-input" 
                    placeholder="Visitor 1 Name (e.g. Rahul Sharma)" 
                    required 
                    autocomplete="off"
                  >
                </div>
                <button type="button" class="btn-remove-row" style="display: none;" title="Remove Visitor">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  </svg>
                </button>
              </div>
            </div>

            <button type="button" id="btn-add-verify-visitor" class="btn-add-visitor">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              + Add Visitor
            </button>
          </div>

          <!-- Authorization PIN Section ONLY -->
          <div class="form-section">
            <div class="section-label-row">
              <label for="verify-pin" class="form-label">
                Authorization PIN
                <span class="required-indicator">*</span>
              </label>
            </div>
            <div class="pin-input-group">
              <div class="input-icon-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <input 
                  type="password" 
                  id="verify-pin" 
                  class="form-control pin-control" 
                  placeholder="Enter PIN" 
                  maxlength="16" 
                  required 
                  autocomplete="current-password"
                >
              </div>
              <button type="button" id="btn-toggle-verify-pin" class="btn-toggle-pin" title="Toggle PIN Visibility">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" id="btn-verify-entry" class="btn-primary" style="background: linear-gradient(135deg, #059669, #0d9488);">
            <span class="spinner"></span>
            <span class="btn-text">VERIFY ENTRY</span>
          </button>
        </form>

        <!-- High-Visibility Gate Status Display -->
        <div id="verify-result-box" class="result-box" role="alert"></div>

      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>Main Gate Visitor Entry Authorization System &bull; Live Security Checkpoint</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
